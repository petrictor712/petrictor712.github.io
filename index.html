<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Chen 的个人博客与文章归档。">
  <title>Chen’s Journal</title>
  <link rel="icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="/journal.css?v=stars-1">
  <script defer src="/journal.js?v=layout-1"></script>
</head>
<body data-page="home">
  <a class="skip" href="#posts">跳到文章</a>
  <header class="bar"><div class="shell bar-inner">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">C</span> Chen’s Journal</a>
    <nav aria-label="主导航"><a href="#posts">文章</a><a href="/archives/">旧文归档</a><a class="button small" href="/studio.html">博主管理</a><button type="button" class="theme-button" data-theme-toggle aria-label="深色模式" aria-pressed="false" title="切换深色模式" hidden><span aria-hidden="true">◐</span></button></nav>
  </div></header>
  <main>
    <section class="hero shell" aria-labelledby="page-title">
      <img class="hero-art" src="/images/blog-hero.webp" alt="" fetchpriority="high" decoding="async">
      <div class="star-sky" aria-hidden="true">
        <span class="shooting-star"></span>
        <span class="shooting-star"></span>
      </div>
      <div class="hero-copy">
        <div class="hero-profile">
          <img class="avatar" data-avatar src="/images/avatar.jpg" width="44" height="44" alt="Chen 的头像">
          <span>个人博客</span>
        </div>
        <h1 id="page-title">Chen’s Journal<span>.</span></h1>
        <p class="intro">文章与随笔</p>
        <a class="hero-link" href="#posts">浏览文章 <span aria-hidden="true">↓</span></a>
      </div>
      <div id="journal-clock" class="journal-clock" hidden>
        <span class="clock-label">北京时间</span>
        <time id="clock-time"></time>
        <span id="clock-date" class="clock-date"></span>
      </div>
    </section>
    <section id="posts" class="shell post-section" aria-labelledby="posts-title">
      <div class="section-head">
        <div class="post-heading">
          <div class="post-heading-line">
            <h2 id="posts-title">文章</h2>
            <a class="add-post" href="/studio.html#article-editor" aria-label="添加新文章" title="添加新文章"><span aria-hidden="true">+</span></a>
          </div>
          <p id="result-count" aria-live="polite">3 篇文章</p>
        </div>
        <div class="post-controls">
          <label class="search"><span>搜索文章</span><input id="search" type="search" placeholder="输入标题、正文或标签" autocomplete="off"></label>
          <label id="order-control" hidden><span>排序</span><select id="post-order"><option value="newest">最新优先</option><option value="oldest">最早优先</option></select></label>
        </div>
      </div>
      <div id="post-tags" class="tag-filter" role="group" aria-label="按标签筛选文章" hidden></div>
      <div id="post-grid" class="post-grid">
        <article class="card has-cover"><a href="/2024/05/10/my-test-draft/"><img src="/images/blog-draft.webp" alt="" loading="lazy"><div class="card-body"><time datetime="2024-05-10">2024 年 5 月 10 日</time><h3>my-test-draft</h3><span class="card-arrow" aria-hidden="true">↗</span></div></a></article>
        <article class="card has-cover"><a href="/2024/05/10/mt-tset-post/"><img src="/images/blog-test.webp" alt="" loading="lazy"><div class="card-body"><time datetime="2024-05-10">2024 年 5 月 10 日</time><h3>mt-tset-post</h3><span class="card-arrow" aria-hidden="true">↗</span></div></a></article>
        <article class="card has-cover"><a href="/2024/05/10/hello-world/"><img src="/images/blog-hello.webp" alt="" loading="lazy"><div class="card-body"><time datetime="2024-05-10">2024 年 5 月 10 日</time><h3>Hello World</h3><p>Hexo 入门示例，包含写作、预览和部署命令。</p><span class="card-arrow" aria-hidden="true">↗</span></div></a></article>
      </div>
      <p id="feed-status" class="muted" role="status"></p>
    </section>
  </main>
  <footer class="shell footer"><span>Chen’s Journal</span><a href="/archives/">旧文归档</a><a href="/studio.html">写文章或更换头像 ↗</a></footer>
</body>
</html>
